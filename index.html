<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Подарок: Поле чудес с заданиями</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #2b3b4e 0%, #1d2c3a 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f0ede8;
        }

        .page {
            max-width: 1200px;

            background: rgba(255,255,240,0.1);

        .hidden-page {

        h1 {

        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));

            margin: 30px 0;
        }

<body>

<!-- СТАРТОВАЯ СТРАНИЦА -->
<div id="start-page" class="page">
    <h1> СЮРПРИЗ ДЛЯ ТЕБЯ </h1>
    <p style="text-align:center;">Выполни 7 заланий! Каждое из них даст тебе одну букву! </p>
    
    <div class="tasks-grid" id="tasks-grid"></div>

    <button id="go-to-wheel-btn" class="big-button">🎡 ВВЕСТИ БУКВУ 🎡</button>
    <footer>Кликни на задание — оно откроется, но даже если не решать, буквы можно вводить сколько угодно.</footer>
</div>

<!-- СТРАНИЦА ПОЛЯ ЧУДЕС (без лимита попыток) -->
<div id="wheel-page" class="page hidden-page">
    <div class="wheel-container">
        <h2>К   Р  У  Т  И  Т  Е       Б  А  Р  А  Б  А  Н</h2>
        <img id="wheel-image" class="wheel-img" src="zm11g6ff6wcymqwuk16ghsiefre6pjcd.jpg" alt="КРУТИТЕ БАРАБАН">
        <div class="word-display" id="word-mask"></div>
        
        <div class="letter-input-wrapper">
            <label for="letter-input" class="input-label"> Введи букву!</label>
            <div class="letter-input-area">
                <input type="text" id="letter-input" maxlength="1" placeholder="?" autocomplete="off">
                <button id="guess-letter-btn" class="guess-btn">УГАДАТЬ</button>
            </div>
        </div>
<div id="wheel-message" class="message"></div>
        <button id="back-to-tasks" class="big-button back-btn">⬅ ЗАДАНИЯ</button>
    </div>
</div>

<!-- Модальное окно для заданий (пока заглушка) -->
<div id="task-modal" class="modal">
    <div class="modal-content">
        <div style="font-size: 3rem;">📜</div>
        <h3 id="modal-task-title">Задание №1</h3>
        <div id="modal-task-text"></div>
    </div>
</div>

<script>
    // ========== НАСТРОЙКИ ==========
    const SECRET_WORD = "БУЛОЧКА".toUpperCase();   // загаданное слово
    const FINAL_PRIZE_IMG = "qr.png";; // замените на свою картинку с QR-кодом

    let tasksSolved = [false, false, false, false, false, false, false]; // просто для отметки
    let guessedLetters = [];      // уже открытые буквы
    let wordArray = SECRET_WORD.split('');
    let displayMask = SECRET_WORD.split('').map(() => '_');
    let gameFinished = false;

    // DOM элементы
    const startPage = document.getElementById('start-page');
    const wheelPage = document.getElementById('wheel-page');
    const tasksGrid = document.getElementById('tasks-grid');
    const goToWheelBtn = document.getElementById('go-to-wheel-btn');
    const backToTasksBtn = document.getElementById('back-to-tasks');
    const wordMaskSpan = document.getElementById('word-mask');
    const letterInput = document.getElementById('letter-input');
    const guessBtn = document.getElementById('guess-letter-btn');
    const wheelMessage = document.getElementById('wheel-message');
    const wheelImage = document.getElementById('wheel-image');

    // Модалка
    const modal = document.getElementById('task-modal');
    const modalTitle = document.getElementById('modal-task-title');
    const modalText = document.getElementById('modal-task-text');
    const solveBtn = document.getElementById('solve-task-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    let currentTaskIndex = null;

    // Обновить маску слова на экране
    function updateWordDisplay() {
        let display = displayMask.join(' ');
        wordMaskSpan.innerText = display;
        if (!gameFinished && !displayMask.includes('_')) {
            gameFinished = true;
            wheelMessage.innerHTML = "🎉 Ура! С днем рождения, любимый Матвей! 🎉";
            const prizeHtml = `<img src="${FINAL_PRIZE_IMG}" alt="QR-сюрприз" class="prize-img"><p style="margin-top:10px;"></p>`;
            wheelMessage.innerHTML += `<br>${prizeHtml}`;
            guessBtn.disabled = true;
            letterInput.disabled = true;
        }
    }

    function rebuildMask() {
    const container = document.getElementById('word-mask');
    container.innerHTML = '';
    for (let i = 0; i < wordArray.length; i++) {
        const letter = wordArray[i];
        const isGuessed = guessedLetters.includes(letter);
        const card = document.createElement('div');
        card.className = 'letter-card';
        if (isGuessed) {
            card.textContent = letter;
            card.classList.add('flip');
        } else {
            card.textContent = '?';
        }
        container.appendChild(card);
    }
    // Проверка на полное отгадывание (как было раньше)
    if (!gameFinished && !wordArray.some(letter => !guessedLetters.includes(letter))) {
        gameFinished = true;
        const wheelMessage = document.getElementById('wheel-message');
        wheelMessage.innerHTML = "🎉Ура! С днем рождения, любимый Матвей! 🎉";
        const prizeHtml = `<img src="${FINAL_PRIZE_IMG}" alt="QR-сюрприз" class="prize-img"><p style="margin-top:10px;"></p>`;
        wheelMessage.innerHTML += `<br>${prizeHtml}`;
        document.getElementById('guess-letter-btn').disabled = true;
        document.getElementById('letter-input').disabled = true;
    }
    }       

    // Угадывание буквы — БЕЗ ОГРАНИЧЕНИЙ
    function guessLetter() {
    if (gameFinished) {
        wheelMessage.innerText = "Игра уже завершена! Смотри QR-код :)";
        return;
    }
    let rawLetter = letterInput.value.trim();
    if (rawLetter.length !== 1) {
        wheelMessage.innerText = "";
        return;
    }
    
    // Приводим к верхнему регистру
    let letter = rawLetter.toUpperCase();
    
    // Таблица соответствия английских букв русским (на случай, если забыли переключить раскладку)
    const engToRus = {
        'A':'А', 'B':'В', 'C':'С', 'E':'Е', 'H':'Н', 'K':'К', 'M':'М', 'O':'О', 
        'P':'Р', 'T':'Т', 'X':'Х', 'Y':'У', 'I':'И', 'F':'Ф', 'U':'У', 'V':'В'
    };
    if (engToRus[letter]) {
        letter = engToRus[letter];
    }
    
    // Дополнительная проверка: если символ не русская буква (и не стала русской после замены) — ошибка
    if (!/^[А-ЯЁ]$/i.test(letter)) {
        wheelMessage.innerText = "Можно вводить только буквы (русские или похожие английские).";
        return;
    }
    
    // Если буква уже открыта
    if (guessedLetters.includes(letter)) {
        wheelMessage.innerText = `Буква "${letter}" уже открыта! Попробуй другую.`;
        letterInput.value = '';
        return;
    }
    
    // Проверка наличия в слове
    if (wordArray.includes(letter)) {
        guessedLetters.push(letter);
        rebuildMask();
        // Не перезаписываем сообщение, если игра уже завершена (QR-код показан)
        if (!gameFinished) {
            wheelMessage.innerText = `✅ Есть буква "${letter}"! Отлично!`;
        }
    } else {
        wheelMessage.innerText = `❌ Нет буквы "${letter}". Попробуй другую. (Попытки не ограничены)`;
    }
    letterInput.value = '';
}
